name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # published site lives at constellation.thehartstudio.live/pangram-reaction,
      # so the built app goes into a pangram-reaction/ subfolder of the Pages root
      - name: Assemble Pages root
        run: |
          mkdir -p pages-root/pangram-reaction
          cp -r dist/* pages-root/pangram-reaction/
          echo "constellation.thehartstudio.live" > pages-root/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-root

      - id: deployment
        uses: actions/deploy-pages@v4
